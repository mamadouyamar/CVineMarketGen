[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CVineMarketGen"
version = "0.1.0"
description = "C-vine copula financial market generator with moment and tail dependence targeting, and the Fleishman / Vale-Maurelli benchmark (thesis, article 3)."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.8"
authors = [{ name = "Mamadou Yamar Thioub", email = "mamadou-yamar.thioub@hec.ca" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "requests",
    "pyvinecopulib>=0.6",
]

[project.optional-dependencies]
test = ["pytest"]
doc = ["sphinx", "sphinx_rtd_theme", "myst-nb", "ipykernel"]

[project.urls]
Homepage = "https://github.com/mamadouyamar/CVineMarketGen"

[tool.setuptools]
packages = ["cvinemarketgen"]
